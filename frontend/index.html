<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f4f4;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    input, button {
      padding: 10px;
      margin: 5px;
    }

    input {
      width: 250px;
    }

    button {
      cursor: pointer;
    }

    #chat {
      height: 350px;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 15px;
      background: #fafafa;
    }

    .message {
      padding: 8px;
      margin: 5px 0;
      background: #e8f0fe;
      border-radius: 8px;
    }

    .error {
      color: red;
    }

    .success {
      color: green;
    }
  </style>
</head>

<body>

<h1>Chat App</h1>

<div class="box">

  <h2>Friends</h2>

  <input id="friendId" type="number" placeholder="User ID">

  <button onclick="sendFriendRequest()">
    Add friend
  </button>

  <button onclick="loadFriends()">
    Refresh friends
  </button>

  <h3>My friends</h3>

  <div id="friendsList"></div>

  <h3>Friend requests</h3>

  <div id="requestsList"></div>

</div>  
<div class="box">

  <h2>Account</h2>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <br>

  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>

  <p id="status"></p>

</div>


<div class="box">

  <h2>Rooms</h2>

  <input id="roomName" placeholder="New room name">
  <button onclick="createRoom()">Create room</button>

  <br>

  <input id="room" placeholder="Room ID">
  <button onclick="join()">Join room</button>

</div>


<div class="box">

  <h2>Chat</h2>

  <div id="chat"></div>

  <br>

  <input id="msg" placeholder="Write a message">

  <button onclick="send()">Send</button>

</div>


<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>

let socket = null;
let token = null;
let currentRoom = null;


function showStatus(message, type = "") {
  const status = document.getElementById("status");

  status.textContent = message;
  status.className = type;
}


async function register() {

  try {

    const res = await fetch(
      "http://localhost:3000/auth/register",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          email: document.getElementById("email").value,
          username: "user" + Date.now(),
          password: document.getElementById("password").value
        })
      }
    );

    if (!res.ok) {
      throw new Error("Registration failed");
    }

    showStatus("Registration successful", "success");

  } catch (error) {

    showStatus(error.message, "error");

  }
}


async function login() {

  try {

    const res = await fetch(
      "http://localhost:3000/auth/login",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value
        })
      }
    );

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || data);
    }

    token = data.token;

    socket = io(
      "http://localhost:3000",
      {
        auth: {
          token
        }
      }
    );

    socket.on("connect", () => {
      showStatus("Logged in successfully", "success");
    });
      loadFriends();
    socket.on("roomHistory", messages => {

      const chat = document.getElementById("chat");

      chat.innerHTML = "";

      messages.forEach(addMessage);

    });

    socket.on("roomMessage", addMessage);

    socket.on("errorMessage", data => {
      showStatus(data.message, "error");
    });

  } catch (error) {

    showStatus(error.message, "error");

  }
}


async function createRoom() {

  if (!token) {
    showStatus("Please login first", "error");
    return;
  }

  const name = document.getElementById("roomName").value;

  try {

    const res = await fetch(
      "http://localhost:3000/rooms",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },

        body: JSON.stringify({
          name
        })
      }
    );

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error);
    }

    document.getElementById("room").value = data.id;

    showStatus(
      "Room created. ID: " + data.id,
      "success"
    );

  } catch (error) {

    showStatus(error.message, "error");

  }
}

async function sendFriendRequest() {

  if (!token) {
    showStatus("Please login first", "error");
    return;
  }

  const friendId = document.getElementById("friendId").value;

  if (!friendId) {
    showStatus("Enter user ID", "error");
    return;
  }

  try {

    const res = await fetch(
      "http://localhost:3000/friends/request",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },

        body: JSON.stringify({
          friend_id: Number(friendId)
        })
      }
    );

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || "Failed to send request");
    }

    showStatus(
      "Friend request sent",
      "success"
    );

    document.getElementById("friendId").value = "";

  } catch (error) {

    showStatus(error.message, "error");

  }
}


async function loadFriends() {

  if (!token) {
    showStatus("Please login first", "error");
    return;
  }

  try {

    const friendsResponse = await fetch(
      "http://localhost:3000/friends",
      {
        headers: {
          "Authorization": "Bearer " + token
        }
      }
    );

    const friends = await friendsResponse.json();

    const friendsList =
      document.getElementById("friendsList");

    friendsList.innerHTML = "";

    friends.forEach(friend => {

      const div = document.createElement("div");

      div.textContent =
        `${friend.username} (${friend.email})`;

      friendsList.appendChild(div);

    });


    const requestsResponse = await fetch(
      "http://localhost:3000/friends/requests",
      {
        headers: {
          "Authorization": "Bearer " + token
        }
      }
    );

    const requests = await requestsResponse.json();

    const requestsList =
      document.getElementById("requestsList");

    requestsList.innerHTML = "";

    requests.forEach(request => {

      const div = document.createElement("div");

      div.innerHTML = `
        ${request.username}

        <button onclick="acceptFriend(${request.id})">
          Accept
        </button>

        <button onclick="rejectFriend(${request.id})">
          Reject
        </button>
      `;

      requestsList.appendChild(div);

    });

  } catch (error) {

    showStatus(
      "Failed to load friends",
      "error"
    );

  }
}


async function acceptFriend(requestId) {

  try {

    const res = await fetch(
      "http://localhost:3000/friends/requests/" +
      requestId +
      "/accept",
      {
        method: "POST",

        headers: {
          "Authorization": "Bearer " + token
        }
      }
    );

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error);
    }

    showStatus(
      "Friend request accepted",
      "success"
    );

    loadFriends();

  } catch (error) {

    showStatus(error.message, "error");

  }
}


async function rejectFriend(requestId) {

  try {

    const res = await fetch(
      "http://localhost:3000/friends/requests/" +
      requestId +
      "/reject",
      {
        method: "POST",

        headers: {
          "Authorization": "Bearer " + token
        }
      }
    );

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error);
    }

    showStatus(
      "Friend request rejected",
      "success"
    );

    loadFriends();

  } catch (error) {

    showStatus(error.message, "error");

  }
}
async function join() {

  if (!token) {
    showStatus("Please login first", "error");
    return;
  }

  const roomId = document.getElementById("room").value;

  try {

    const res = await fetch(
      "http://localhost:3000/rooms/" + roomId + "/join",
      {
        method: "POST",

        headers: {
          "Authorization": "Bearer " + token
        }
      }
    );

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error);
    }

    currentRoom = roomId;

    socket.emit("joinRoom", roomId);

    showStatus(
      "Joined room " + roomId,
      "success"
    );

  } catch (error) {

    showStatus(error.message, "error");

  }
}


function send() {

  if (!socket) {
    showStatus("Please login first", "error");
    return;
  }

  if (!currentRoom) {
    showStatus("Join a room first", "error");
    return;
  }

  const input = document.getElementById("msg");

  const content = input.value.trim();

  if (!content) {
    return;
  }

  socket.emit(
    "roomMessage",
    {
      roomId: currentRoom,
      content
    }
  );

  input.value = "";

}


function addMessage(message) {

  const chat = document.getElementById("chat");

  const div = document.createElement("div");

  div.className = "message";

  div.textContent = message.content;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;

}

</script>

</body>
</html>
